name: ALSAS AGRO TECH Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version:'17'- name:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version:'latestuses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './source/*' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No source ZIP file found in the repository."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d source
          PROJECT_DIR="$(find source -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found inside the ZIP (settings.gradle.kts missing)."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALSAS-AGRO-TECH-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
